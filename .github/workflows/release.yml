name: Release

# Mirrors the manual steps in dist/README.md: build the source tarball,
# an Apple Silicon macOS .dmg and the Windows .msi, and attach them to a
# draft GitHub Release so a maintainer can review before publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: >-
          Draft release tag to build against (for a test run off a branch;
          a real release is still triggered by pushing a "v*" tag). Must not
          collide with an existing branch name.
        required: true
        default: 'test-build'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  source-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint libtool pkg-config gettext \
            libwxgtk3.2-dev \
            libavformat-dev libavcodec-dev libavutil-dev

      - name: Build and verify the distribution
        run: |
          ./autogen.sh
          make distcheck -j$(nproc)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          files: spek-*.tar.xz

  macos-dmg:
    # Apple Silicon only. macos-13/14 were removed from GitHub's hosted
    # runner fleet (GitHub only keeps the latest 2 macOS versions), and the
    # only Intel label left, macos-15-large, is a paid "large" runner that
    # bills even on public repos. A free-runner workaround (cross-build
    # x86_64 under Rosetta 2) was tried and doesn't work either: Homebrew's
    # installer now hard-refuses on non-arm64 ("Homebrew on macOS is only
    # supported on Apple Silicon processors!"), and its bottles for x86_64
    # macOS are gone too (checked the ffmpeg formula's bottle list: arm64
    # only), so there's nothing to install even with a manual bypass.
    # Bump macos-15 again once it ages out the same way.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install automake autoconf libtool pkg-config gettext ffmpeg wxwidgets

      - name: Build the .app and .dmg
        run: |
          # gettext is keg-only in Homebrew: PATH for its CLI tools
          # (msgfmt etc.), CPPFLAGS/LDFLAGS so configure's libintl link
          # check (NLS support) can find its headers/lib too.
          export PATH="$(brew --prefix gettext)/bin:$PATH"
          export CPPFLAGS="-I$(brew --prefix gettext)/include"
          export LDFLAGS="-L$(brew --prefix gettext)/lib"
          # aclocal doesn't scan Homebrew kegs by default; wx's own macros
          # (AM_PATH_WXCONFIG etc.) live under the wxwidgets keg.
          export ACLOCAL_PATH="$(dirname "$(find -L "$(brew --prefix wxwidgets)" -name wxwin.m4 | head -1)")"
          ./dist/osx/bundle.sh

      - name: Rename artifact
        run: mv dist/osx/Spek.dmg "dist/osx/spek-${{ env.RELEASE_TAG }}-macos-arm64.dmg"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/osx/spek-*-macos-arm64.dmg

  windows-cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MXE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint bash bison bzip2 flex g++ g++-multilib \
            gettext git gperf intltool libc6-dev-i386 libgdk-pixbuf2.0-dev \
            libltdl-dev libgl-dev libpcre2-dev libssl-dev libtool-bin \
            libxml-parser-perl lzip make openssl p7zip-full patch perl \
            python3 python3-mako python3-packaging python3-pkg-resources \
            python3-setuptools ruby sed sqlite3 unzip wget xz-utils

      - name: Cache MXE build
        id: cache-mxe
        uses: actions/cache@v6
        with:
          path: mxe
          # MXE_REF below is pinned (see the Build MXE step); bump this key
          # too if MXE_REF changes, so a stale cache doesn't get reused.
          key: mxe-static-win64-v1-${{ hashFiles('dist/win/mxe.diff') }}

      - name: Build MXE (pthreads, ffmpeg, wxwidgets for static Win64)
        if: steps.cache-mxe.outputs.cache-hit != 'true'
        env:
          # MXE is a rolling repo with no releases/tags; dist/win/mxe.diff
          # is a literal patch, so it needs the exact commit it was
          # generated against, not a moving `master` that will eventually
          # (and did) reorganize the files it touches out from under it.
          # Bump this (and regenerate mxe.diff against the new commit) when
          # a newer MXE ffmpeg/wxwidgets recipe is actually needed.
          MXE_REF: 3bfb859de48d7d6325f2e9b8a1d03b00a0e8d829
        run: |
          git init mxe
          cd mxe
          git remote add origin https://github.com/mxe/mxe.git
          git fetch --depth 1 origin "$MXE_REF"
          git checkout FETCH_HEAD
          git apply ../dist/win/mxe.diff
          make pthreads ffmpeg wxwidgets -j$(nproc) JOBS=$(nproc) \
            MXE_TARGETS='x86_64-w64-mingw32.static'

      - name: Cross-compile spek.exe and test.exe
        run: ./dist/win/bundle.sh

      - name: Upload build for MSI packaging
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            dist/win/Spek
            dist/win/tests
            dist/win/spek.zip
            dist/win/spek.wxs

  windows-msi:
    needs: windows-cross-compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: dist/win

      - name: Install WiX Toolset v3.11
        run: choco install wixtoolset --version=3.11.2 -y

      - name: Run the cross-compiled test suite
        run: |
          cd dist\win\tests
          .\test.exe

      - name: Build the MSI
        run: |
          cd dist\win
          cmd /c bundle.bat

      - name: Rename artifact
        run: move dist\win\spek.msi "dist\win\spek-${{ env.RELEASE_TAG }}-windows.msi"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/win/spek-*-windows.msi
            dist/win/spek.zip
