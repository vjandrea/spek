name: Release

# Mirrors the manual steps in dist/README.md: build the source tarball,
# a universal (x86_64 + arm64) macOS .dmg and the Windows .msi, and attach
# them to a draft GitHub Release so a maintainer can review before
# publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: >-
          Draft release tag to build against (for a test run off a branch;
          a real release is still triggered by pushing a "v*" tag). Must not
          collide with an existing branch name.
        required: true
        default: 'test-build'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  source-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint libtool pkg-config gettext \
            libwxgtk3.2-dev \
            libavformat-dev libavcodec-dev libavutil-dev

      - name: Build and verify the distribution
        run: |
          ./autogen.sh
          make distcheck -j$(nproc)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          files: spek-*.tar.xz

  macos-dmg-universal:
    # macos-13/14 were removed from GitHub's hosted runner fleet (GitHub only
    # keeps the latest 2 macOS versions), and the only Intel label left,
    # macos-15-large, is a paid "large" runner that bills even on public
    # repos. So: build both slices on one free (Apple Silicon) runner, the
    # x86_64 one via Homebrew's own documented Rosetta 2 coexistence support
    # (native arm64 at /opt/homebrew, Rosetta/Intel at /usr/local), then lipo
    # them together. Bump macos-15 again once it ages out the same way.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install native (arm64) dependencies
        run: brew install automake autoconf libtool pkg-config gettext ffmpeg wxwidgets

      - name: Build the arm64 .app
        env:
          SKIP_DMG: '1'
        run: |
          # gettext is keg-only in Homebrew: PATH for its CLI tools
          # (msgfmt etc.), CPPFLAGS/LDFLAGS so configure's libintl link
          # check (NLS support) can find its headers/lib too.
          export PATH="$(brew --prefix gettext)/bin:$PATH"
          export CPPFLAGS="-I$(brew --prefix gettext)/include"
          export LDFLAGS="-L$(brew --prefix gettext)/lib"
          # aclocal doesn't scan Homebrew kegs by default; wx's own macros
          # (AM_PATH_WXCONFIG etc.) live under the wxwidgets keg.
          export ACLOCAL_PATH="$(dirname "$(find -L "$(brew --prefix wxwidgets)" -name wxwin.m4 | head -1)")"
          ./dist/osx/bundle.sh
          mv dist/osx/Spek.app dist/osx/Spek-arm64.app

      - name: Install Rosetta and x86_64 Homebrew
        run: |
          softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          arch -x86_64 /usr/local/bin/brew install automake autoconf libtool pkg-config gettext ffmpeg wxwidgets

      - name: Build the x86_64 .app
        env:
          SKIP_DMG: '1'
        run: |
          # /usr/local first so bundle.sh's own `brew` calls hit the Rosetta
          # install, not the native arm64 one also on PATH. Same keg-only
          # gettext CPPFLAGS/LDFLAGS as the arm64 pass, against this second,
          # x86_64 Homebrew's own gettext keg.
          export PATH="/usr/local/bin:$(arch -x86_64 /usr/local/bin/brew --prefix gettext)/bin:$PATH"
          export CPPFLAGS="-I$(arch -x86_64 /usr/local/bin/brew --prefix gettext)/include"
          export LDFLAGS="-L$(arch -x86_64 /usr/local/bin/brew --prefix gettext)/lib"
          export ACLOCAL_PATH="$(dirname "$(find -L "$(arch -x86_64 /usr/local/bin/brew --prefix wxwidgets)" -name wxwin.m4 | head -1)")"
          arch -x86_64 ./dist/osx/bundle.sh
          mv dist/osx/Spek.app dist/osx/Spek-x86_64.app

      - name: Merge into a universal binary
        run: ./dist/osx/lipo-universal.sh dist/osx/Spek-x86_64.app dist/osx/Spek-arm64.app dist/osx/Spek.app

      - name: Package the .dmg
        run: ./dist/osx/make-dmg.sh

      - name: Rename artifact
        run: mv dist/osx/Spek.dmg "dist/osx/spek-${{ env.RELEASE_TAG }}-macos-universal.dmg"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/osx/spek-*-macos-universal.dmg

  windows-cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MXE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint bash bison bzip2 flex g++ g++-multilib \
            gettext git gperf intltool libc6-dev-i386 libgdk-pixbuf2.0-dev \
            libltdl-dev libgl-dev libpcre2-dev libssl-dev libtool-bin \
            libxml-parser-perl lzip make openssl p7zip-full patch perl \
            python3 python3-mako python3-packaging python3-pkg-resources \
            python3-setuptools ruby sed sqlite3 unzip wget xz-utils

      - name: Cache MXE build
        id: cache-mxe
        uses: actions/cache@v6
        with:
          path: mxe
          # MXE is a rolling repo; bump this key (or pin a commit below) if a
          # package recipe changes upstream and the cache needs a rebuild.
          key: mxe-static-win64-v1-${{ hashFiles('dist/win/mxe.diff') }}

      - name: Build MXE (pthreads, ffmpeg, wxwidgets for static Win64)
        if: steps.cache-mxe.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/mxe/mxe.git
          cd mxe
          git apply ../dist/win/mxe.diff
          make pthreads ffmpeg wxwidgets -j$(nproc) JOBS=$(nproc) \
            MXE_TARGETS='x86_64-w64-mingw32.static'

      - name: Cross-compile spek.exe and test.exe
        run: ./dist/win/bundle.sh

      - name: Upload build for MSI packaging
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            dist/win/Spek
            dist/win/tests
            dist/win/spek.zip
            dist/win/spek.wxs

  windows-msi:
    needs: windows-cross-compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: dist/win

      - name: Install WiX Toolset v3.11
        run: choco install wixtoolset --version=3.11.2 -y

      - name: Run the cross-compiled test suite
        run: |
          cd dist\win\tests
          .\test.exe

      - name: Build the MSI
        run: |
          cd dist\win
          cmd /c bundle.bat

      - name: Rename artifact
        run: move dist\win\spek.msi "dist\win\spek-${{ env.RELEASE_TAG }}-windows.msi"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/win/spek-*-windows.msi
            dist/win/spek.zip
