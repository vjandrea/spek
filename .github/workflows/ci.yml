name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint libtool pkg-config gettext \
            libwxgtk3.2-dev \
            libavformat-dev libavcodec-dev libavutil-dev

      - name: Build
        run: |
          ./autogen.sh
          make -j$(nproc)

      - name: Test
        run: make check -j$(nproc)

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-test-logs
          path: |
            tests/*.log
            config.log

  macos:
    # Apple Silicon only: macos-13/14 were removed from GitHub's hosted
    # runner fleet, and the only remaining Intel label, macos-15-large, is a
    # paid "large" runner that bills even on public repos. x86_64 still gets
    # a real build on every release, via the Rosetta cross-build in
    # release.yml; that's not worth repeating here on every push/PR.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install automake autoconf libtool pkg-config gettext ffmpeg wxwidgets

      - name: Build
        run: |
          export PATH="$(brew --prefix gettext)/bin:$PATH"
          # aclocal doesn't scan Homebrew kegs by default; wx's own macros
          # (AM_PATH_WXCONFIG etc.) live under the wxwidgets keg.
          export ACLOCAL_PATH="$(dirname "$(find -L "$(brew --prefix wxwidgets)" -name wxwin.m4 | head -1)")"
          ./autogen.sh
          make -j$(sysctl -n hw.ncpu)

      - name: Test
        run: make check -j$(sysctl -n hw.ncpu)

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-logs
          path: |
            tests/*.log
            config.log

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      # mingw-w64-x86_64-libgfortran is pulled in explicitly to steer pacman's
      # dependency solver away from the gcc-libgfortran provider, whose
      # pinned gcc-libs version can lag the rest of the mingw64 repo and
      # leave mingw-w64-x86_64-ffmpeg unresolved.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            autotools
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-libgfortran
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-wxwidgets3.2-msw

      - name: Build
        run: |
          ./autogen.sh
          make -j$(nproc)

      - name: Test
        run: make check -j$(nproc)

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-logs
          path: |
            tests/*.log
            config.log
